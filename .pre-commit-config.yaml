# pre-commit hooks: corren clippy + rustfmt + ruff antes de cada commit.
# Setup:
#   pip install pre-commit
#   pre-commit install
#
# Para correr manualmente sobre todo el repo:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.svg$
      - id: end-of-file-fixer
        exclude: \.(svg|png|ico|icns)$
      - id: check-yaml
      - id: check-json
        exclude: tsconfig\.json$  # permite comentarios estilo JSONC
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  # Rust: formatter + linter (estricto).
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (src-tauri)
        entry: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
        language: system
        files: ^src-tauri/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (src-tauri)
        entry: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        language: system
        files: ^src-tauri/.*\.rs$
        pass_filenames: false

  # Python: ruff (linter + formatter ultra rápido, reemplaza black + flake8 + isort).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^vision/.*\.py$
      - id: ruff-format
        files: ^vision/.*\.py$

  # Svelte / TypeScript: svelte-check (type checking).
  - repo: local
    hooks:
      - id: svelte-check
        name: svelte-check
        entry: npm run check
        language: system
        files: \.(svelte|ts|js)$
        pass_filenames: false
