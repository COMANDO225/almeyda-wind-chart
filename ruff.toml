# Configuración de ruff para el sidecar Python.
# Docs: https://docs.astral.sh/ruff/

target-version = "py311"
line-length = 100
src = ["vision"]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line-too-long (ya hay max line-length)
    "B008",   # function-call-in-default-argument (común con FastAPI/typer)
]

[lint.per-file-ignores]
"vision/tests/*.py" = ["B", "SIM"]  # tests pueden ser laxos

[format]
quote-style = "double"
indent-style = "space"
